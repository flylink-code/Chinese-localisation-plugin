name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            manifest: latest.yml
            artifacts: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          - os: ubuntu-latest
            script: dist:linux
            manifest: latest-linux.yml
            artifacts: |
              dist/*.AppImage
              dist/*.deb
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run ${{ matrix.script }}
        working-directory: app
      - name: Verify update manifest
        run: test -f "${{ matrix.manifest }}"
        working-directory: dist
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
